name: Manuscript Moisture MLOps CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-train-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Generate synthetic data versions
        run: python -m src.generate_data

      - name: Materialize feature store
        run: python -m src.feature_pipeline

      - name: Train and register best model in MLflow
        run: python -m src.train

      - name: Run validation and API tests
        run: python -m pytest -q

      - name: Upload metrics and model metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-moisture-mlops-evidence
          path: |
            artifacts/metrics.json
            artifacts/model_metadata.json
            data/raw/dataset_versions.json
